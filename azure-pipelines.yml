trigger:
- main

pr:
- main

pool:
  name: 'Default'

variables:
- group: budget-tracker-secretes
# Set a custom global variable for npm's cache directory location
- name: npm_config_cache
  value: $(Pipeline.Workspace)/.npm

stages:

# ── STAGE 1: TEST ─────────────────────────────────────────────────────────────
- stage: Test
  displayName: 'Test'
  jobs:

  - job: Frontend_Test
    displayName: 'Frontend — Lint'
    steps:
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | app-frontend/package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: $(npm_config_cache) # Correct: Cache the npm cache, not node_modules
      displayName: 'Cache npm directory'

    - script: |
        cd app-frontend
        npm ci # npm ci will now pulled zipped packages directly from $(npm_config_cache)
      displayName: 'Install dependencies'

    - script: |
        cd app-frontend
        npm run lint
      displayName: 'Lint'

  - job: Backend_Test
    displayName: 'Backend — Check & Test'
    steps:
    - task: Cache@2
      inputs:
        key: 'pip | "$(Agent.OS)" | backend/requirements.txt'
        restoreKeys: 'pip | "$(Agent.OS)"'
        path: backend/venv
        cacheHitVar: PIP_CACHE_HIT # Creates a variable we can check in the next step
      displayName: 'Cache venv'

    - script: |
        cd backend
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
      # Crucial: Only run this whole step if requirements.txt actually changed!
      condition: ne(variables['PIP_CACHE_HIT'], 'true') 
      displayName: 'Install dependencies (Skip if Cache Hit)'

    - script: |
        cd backend
        source venv/bin/activate
        python manage.py check
      displayName: 'Django check'
      env:
        DJANGO_SECRET_KEY: $(DJANGO_SECRET_KEY)
        GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
        GOOGLE_SECRET: $(GOOGLE_SECRET)
        POSTGRES_DB: $(POSTGRES_DB)
        POSTGRES_USER: $(POSTGRES_USER)
        POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
        POSTGRES_HOST: $(POSTGRES_HOST)
        POSTGRES_PORT: $(POSTGRES_PORT)

    - script: |
        cd backend
        source venv/bin/activate
        python manage.py test
      displayName: 'Run tests'
      env:
        DJANGO_SECRET_KEY: $(DJANGO_SECRET_KEY)
        GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
        GOOGLE_SECRET: $(GOOGLE_SECRET)
        POSTGRES_DB: $(POSTGRES_DB)
        POSTGRES_USER: $(POSTGRES_USER)
        POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
        POSTGRES_HOST: $(POSTGRES_HOST)
        POSTGRES_PORT: $(POSTGRES_PORT)

# ── STAGE 2: BUILD ────────────────────────────────────────────────────────────
- stage: Build
  displayName: 'Build'
  dependsOn: Test
  jobs:

  - job: Build_Frontend
    displayName: 'Frontend — Build & Publish Artifact'
    steps:
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | app-frontend/package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: $(npm_config_cache) # Match the exact same fixed caching path here
      displayName: 'Cache npm directory'

    - script: |
        cd app-frontend
        npm ci
        npm run build
      displayName: 'TypeScript + Vite build'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'app-frontend/dist'
        artifact: 'frontend-dist'
        publishLocation: 'pipeline'
      displayName: 'Publish dist/ as pipeline artifact'