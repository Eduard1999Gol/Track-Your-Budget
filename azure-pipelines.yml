trigger:
- main

pr:
- main

pool:
  name: 'Default'

variables:
- group: budget-tracker-secretes   # links the Variable Group from Step 1

steps:

# ── FRONTEND ──────────────────────────────────────────────
- script: |
    cd app-frontend
    npm ci
  displayName: 'Frontend: Install dependencies'

- script: |
    cd app-frontend
    npm run lint
  displayName: 'Frontend: Lint'

- script: |
    cd app-frontend
    npm run build
  displayName: 'Frontend: Build (TypeScript + Vite)'

# ── BACKEND ───────────────────────────────────────────────
- script: |
    cd backend
    python3 -m venv venv
    source venv/bin/activate
    pip install -r requirements.txt
  displayName: 'Backend: Install dependencies'

- script: |
    cd backend
    source venv/bin/activate
    python manage.py check
  displayName: 'Backend: Django check'
  env:
    DJANGO_SECRET_KEY: $(DJANGO_SECRET_KEY)
    GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
    GOOGLE_SECRET: $(GOOGLE_SECRET)
    POSTGRES_DB: $(POSTGRES_DB)
    POSTGRES_USER: $(POSTGRES_USER)
    POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
    POSTGRES_HOST: $(POSTGRES_HOST)
    POSTGRES_PORT: $(POSTGRES_PORT)

- script: |
    cd backend
    source venv/bin/activate
    python manage.py test
  displayName: 'Backend: Run tests'
  env:
    DJANGO_SECRET_KEY: $(DJANGO_SECRET_KEY)
    GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
    GOOGLE_SECRET: $(GOOGLE_SECRET)
    POSTGRES_DB: $(POSTGRES_DB)
    POSTGRES_USER: $(POSTGRES_USER)
    POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
    POSTGRES_HOST: $(POSTGRES_HOST)
    POSTGRES_PORT: $(POSTGRES_PORT)